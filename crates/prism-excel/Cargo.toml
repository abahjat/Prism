[package]
name = "prism-excel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native Excel workbook model, XLSX and BIFF8 XLS readers, conditional formatting, and print/grid layout for Prism"

[dependencies]
prism-core.workspace = true
prism-drawingml.workspace = true
prism-layout.workspace = true
prism-numfmt.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml = { version = "0.42", features = ["serialize"] }
zip = "0.6"
cfb = "0.10"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tga",
] }
