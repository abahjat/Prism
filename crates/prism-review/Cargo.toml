[package]
name = "prism-review"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Annotations, sidecar persistence, destructive redactions, verification, and content-addressed caching for Prism"
keywords = ["ediscovery", "redaction", "annotations", "forensics", "review"]
categories = ["text-processing", "multimedia"]

[dependencies]
prism-core = { workspace = true }
prism-excel = { workspace = true }
prism-layout = { workspace = true }
prism-parsers = { workspace = true }
prism-ppt = { workspace = true }
prism-render = { workspace = true }
prism-word = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
regex = "1.12"
lopdf = "0.46"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
