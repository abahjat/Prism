[package]
name = "prism-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Process-isolated worker pool and OS sandboxing for untrusted document parsing and rendering"
keywords = ["sandbox", "isolation", "security", "worker-pool", "ediscovery"]
categories = ["os", "parser-implementations"]

[[bin]]
name = "prism-worker"
path = "src/bin/prism-worker.rs"

[dependencies]
prism-core = { workspace = true }
prism-excel = { workspace = true }
prism-layout = { workspace = true }
prism-parsers = { workspace = true }
prism-ppt = { workspace = true }
prism-render = { workspace = true }
prism-review = { workspace = true }
prism-word = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
