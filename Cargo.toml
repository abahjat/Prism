[workspace]
resolver = "2"
members = [
    "crates/prism-core",
    "crates/prism-drawingml",
    "crates/prism-excel",
    "crates/prism-layout",
    "crates/prism-numfmt",
    "crates/prism-ppt",
    "crates/prism-word",
    "crates/prism-parsers",
    "crates/prism-production",
    "crates/prism-render",
    "crates/prism-review",
    "crates/prism-sandbox",
    "crates/prism-server",
    "crates/prism-cli",
    "crates/prism-bindings",
    "crates/prism-tests",
]
# Built separately with cargo-fuzz (nightly)
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["InfoSeek LLC"]
license = "AGPL-3.0-only"
repository = "https://github.com/abahjat/prism"
rust-version = "1.88"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Web framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "fs"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
mime = "0.3"
mime_guess = "2.0"

# Testing
mockall = "0.12"
tempfile = "3.9"
assert_fs = "1.1"
predicates = "3.0"

# Internal crates
prism-core = { path = "crates/prism-core", version = "0.5.0" }
prism-drawingml = { path = "crates/prism-drawingml", version = "0.5.0" }
prism-excel = { path = "crates/prism-excel", version = "0.5.0" }
prism-layout = { path = "crates/prism-layout", version = "0.5.0" }
prism-numfmt = { path = "crates/prism-numfmt", version = "0.5.0" }
prism-ppt = { path = "crates/prism-ppt", version = "0.5.0" }
prism-word = { path = "crates/prism-word", version = "0.5.0" }
prism-parsers = { path = "crates/prism-parsers", version = "0.5.0" }
prism-production = { path = "crates/prism-production", version = "0.5.0" }
prism-render = { path = "crates/prism-render", version = "0.5.0" }
prism-review = { path = "crates/prism-review", version = "0.5.0" }
prism-sandbox = { path = "crates/prism-sandbox", version = "0.5.0" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
debug = false
