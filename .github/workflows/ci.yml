name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build
        run: cargo build --verbose

      # Includes the malformed-input robustness test (crates/prism-tests)
      - name: Run tests
        run: cargo test --verbose

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linting
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Dependency licenses must stay compatible with the commercial license;
  # also checks RustSec advisories and crate sources.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed corpus
        run: mkdir -p fuzz/corpus/parse_any && cp test-files/* fuzz/corpus/parse_any/ || true

      - name: Fuzz parsers (5 minutes)
        working-directory: fuzz
        run: cargo fuzz run parse_any -- -max_total_time=300 -rss_limit_mb=2048 -timeout=20

      - name: Fuzz sanitizer (2 minutes)
        working-directory: fuzz
        run: cargo fuzz run sanitize_html -- -max_total_time=120

      - name: Seed layout and PDF corpora
        run: |
          mkdir -p fuzz/corpus/layout_doc fuzz/corpus/pdf_interpret
          cp test-files/* fuzz/corpus/layout_doc/ || true
          cp test-files/*.pdf fuzz/corpus/pdf_interpret/ || true

      - name: Fuzz layout (3 minutes)
        working-directory: fuzz
        run: cargo fuzz run layout_doc -- -max_total_time=180 -rss_limit_mb=2048 -timeout=20

      - name: Fuzz PDF interpretation (3 minutes)
        working-directory: fuzz
        run: cargo fuzz run pdf_interpret -- -max_total_time=180 -rss_limit_mb=2048 -timeout=20

      - name: Seed Word corpora
        run: |
          mkdir -p fuzz/corpus/word_docx fuzz/corpus/word_doc fuzz/corpus/word_layout
          cp test-files/*.docx fuzz/corpus/word_docx/ || true
          cp test-files/*.doc test-files/*.DOC fuzz/corpus/word_doc/ || true
          cp fuzz/corpus/word_docx/* fuzz/corpus/word_doc/* fuzz/corpus/word_layout/ || true

      - name: Fuzz Word DOCX reader (2 minutes)
        working-directory: fuzz
        run: cargo fuzz run word_docx -- -max_total_time=120 -rss_limit_mb=2048 -timeout=20

      - name: Fuzz Word DOC reader (2 minutes)
        working-directory: fuzz
        run: cargo fuzz run word_doc -- -max_total_time=120 -rss_limit_mb=2048 -timeout=20

      - name: Fuzz Word layout (3 minutes)
        working-directory: fuzz
        run: cargo fuzz run word_layout -- -max_total_time=180 -rss_limit_mb=2048 -timeout=20

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
