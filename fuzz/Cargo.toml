[package]
name = "prism-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.5"
tokio = { version = "1.35", features = ["rt"] }
prism-core = { path = "../crates/prism-core" }
prism-drawingml = { path = "../crates/prism-drawingml" }
prism-excel = { path = "../crates/prism-excel" }
prism-layout = { path = "../crates/prism-layout" }
prism-numfmt = { path = "../crates/prism-numfmt" }
prism-parsers = { path = "../crates/prism-parsers" }
prism-ppt = { path = "../crates/prism-ppt" }
prism-production = { path = "../crates/prism-production" }
prism-render = { path = "../crates/prism-render" }
prism-review = { path = "../crates/prism-review" }
prism-word = { path = "../crates/prism-word" }

[[bin]]
name = "parse_any"
path = "fuzz_targets/parse_any.rs"
test = false
doc = false
bench = false

